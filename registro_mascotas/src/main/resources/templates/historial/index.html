<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <div>
            <span class="text-xs uppercase font-semibold text-teal-700">Historial Clínico</span>
            <h1 class="text-2xl font-bold text-slate-900"
                th:text="${mascota.nombre + (#strings.isEmpty(mascota.especie) ? '' : ' (' + mascota.especie + ')')}"></h1>
            <p class="text-sm text-slate-600 mt-1">
                Raza: <span th:text="${#strings.isEmpty(mascota.raza) ? 'N/A' : mascota.raza}"></span> ·
                Edad: <span th:text="${mascota.edad + ' años'}"></span> ·
                Peso: <span th:text="${mascota.peso == 0 ? 'N/A' : mascota.peso + ' kg'}"></span> ·
                Propietario: <span th:text="${mascota.propietario != null ? mascota.propietario.nombre + (mascota.propietario.apellido == null ? '' : ' ' + mascota.propietario.apellido) : '-'}"></span>
            </p>
        </div>
        <div class="flex gap-3">
            <a th:href="@{/mascotas}" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-700 hover:bg-slate-50">
                ← Mascotas
            </a>
            <a th:href="@{/historial/nuevo(mascotaId=${mascota.id})}"
               class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
                + Registrar Atención
            </a>
        </div>
    </div>

    <div th:if="${param.exito}" class="bg-emerald-50 border border-emerald-300 text-emerald-800 px-4 py-3 rounded-lg text-sm"
         th:text="${param.exito}"></div>

    <div th:if="${#lists.isEmpty(historial)}" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-sm text-slate-500">
        Esta mascota aún no tiene atenciones clínicas registradas.
    </div>

    <div th:if="${!#lists.isEmpty(historial)}" class="space-y-4">
        <article th:each="at : ${historial}" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex justify-between items-center border-b pb-2">
                <span class="text-sm font-semibold text-teal-700" th:text="'Fecha de atención: ' + ${at.fecha}"></span>
                <span class="text-xs text-slate-400" th:text="'Registro #' + ${at.id}"></span>
            </div>
            <div>
                <h3 class="text-xs uppercase font-semibold text-slate-500">Diagnóstico</h3>
                <p class="text-sm text-slate-800" th:text="${at.diagnostico}"></p>
            </div>
            <div>
                <h3 class="text-xs uppercase font-semibold text-slate-500">Tratamiento</h3>
                <p class="text-sm text-slate-800" th:text="${at.tratamiento}"></p>
            </div>
            <div th:if="${at.observaciones != null and !at.observaciones.isBlank()}">
                <h3 class="text-xs uppercase font-semibold text-slate-500">Observaciones</h3>
                <p class="text-sm text-slate-600" th:text="${at.observaciones}"></p>
            </div>
        </article>
    </div>
</main>
</body>
</html>
