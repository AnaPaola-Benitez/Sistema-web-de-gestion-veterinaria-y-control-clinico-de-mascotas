<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Confirmar eliminación de mascota</title>
    </head>
    <body class="bg-gray-100">
        <main class="container max-w-xl mx-auto my-8 p-6 bg-white rounded shadow-md">
            <h1 class="text-2xl font-bold mb-4">Confirmar eliminación</h1>
            <p class="mb-4">¿Deseas eliminar esta mascota? Esta acción no se puede deshacer.</p>
            <dl class="mb-6 space-y-2">
                <div><dt class="font-medium inline">ID: </dt><dd class="inline" th:text="${mascota.id}">ID</dd></div>
                <div><dt class="font-medium inline">Nombre: </dt><dd class="inline" th:text="${mascota.nombre}">Nombre</dd></div>
                <div>
                    <dt class="font-medium inline">Propietario: </dt>
                    <dd class="inline" th:text="${mascota.propietario.nombre + (mascota.propietario.apellido == null ? '' : ' ' + mascota.propietario.apellido)}">Propietario</dd>
                </div>
            </dl>
            <p class="mb-6 text-gray-700">El propietario conservará su registro.</p>
            <form th:action="@{/mascotas/eliminar/{id}(id=${mascota.id})}" method="post" class="flex gap-4">
                <button type="submit" name="confirmado" value="true"
                        class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Confirmar eliminación</button>
                <a th:href="@{/mascotas}" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">Cancelar</a>
            </form>
        </main>
    </body>
</html>
