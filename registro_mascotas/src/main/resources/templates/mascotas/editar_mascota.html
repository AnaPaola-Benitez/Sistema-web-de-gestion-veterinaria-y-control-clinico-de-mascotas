<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Edición de Mascota</title>
    </head>
    <body class="bg-gray-100">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container max-w-3xl mx-auto my-8 p-6 bg-white rounded shadow-md">
            <h1 class="text-3xl font-bold text-center mb-8">Editar Mascota</h1>
            <form th:action="@{/mascotas/actualizar/{id}(id=${mascota.id})}" method="post" class="space-y-6">
                <div>
                    <label for="nombre" class="block text-lg font-medium text-gray-700">Nombre</label>
                    <input type="text" id="nombre" name="nombre" 
                           class="mt-1 block w-full p-2 border border-gray-300 rounded-md" 
                           th:value="${mascota.nombre}" required>
                </div>

                <div>
                    <label for="edad" class="block text-lg font-medium text-gray-700">Edad</label>
                    <input type="number" id="edad" name="edad" min="0"
                           class="mt-1 block w-full p-2 border border-gray-300 rounded-md" 
                           th:value="${mascota.edad}" required>
                </div>

                <div>
                    <label for="propietarioId" class="block text-lg font-medium text-gray-700">Propietario</label>
                    <select id="propietarioId" name="propietario.id" required
                            class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                        <option value="">Selecciona un propietario</option>
                        <option th:each="propietario : ${propietarios}" th:value="${propietario.id}"
                                th:selected="${mascota.propietario != null and mascota.propietario.id == propietario.id}"
                                th:text="${propietario.nombre + (propietario.apellido == null ? '' : ' ' + propietario.apellido)}">Propietario</option>
                    </select>
                    <p th:if="${#lists.isEmpty(propietarios)}" class="mt-2 text-red-600">
                        No hay propietarios registrados. Se necesita uno antes de guardar una mascota.
                    </p>
                </div>

                <fieldset class="space-y-4 border rounded-md p-4">
                    <legend class="px-2 text-lg font-medium text-gray-700">Datos clínicos básicos (opcionales)</legend>
                    <div>
                        <label for="especie" class="block text-gray-700">Especie</label>
                        <input type="text" id="especie" name="especie" maxlength="255" th:value="${mascota.especie}"
                               class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label for="raza" class="block text-gray-700">Raza</label>
                        <input type="text" id="raza" name="raza" maxlength="255" th:value="${mascota.raza}"
                               class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label for="sexo" class="block text-gray-700">Sexo</label>
                        <input type="text" id="sexo" name="sexo" maxlength="255" th:value="${mascota.sexo}"
                               class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label for="peso" class="block text-gray-700">Peso (kg)</label>
                        <input type="number" id="peso" name="peso" min="0" step="any" aria-describedby="ayudaPeso"
                               th:value="${mascota.peso == 0 ? '' : mascota.peso}"
                               class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                        <p id="ayudaPeso" class="mt-1 text-sm text-gray-600">Deja el campo vacío si todavía no se conoce el peso.</p>
                    </div>
                </fieldset>

                <div>
                    <label for="urlImagen" class="block text-lg font-medium text-gray-700">URL de Imagen (opcional)</label>
                    <input type="url" id="urlImagen" name="urlImagen" 
                           class="mt-1 block w-full p-2 border border-gray-300 rounded-md" 
                           th:value="${mascota.urlImagen}">
                </div>

                <div class="text-center space-x-4">
                    <a href="/mascotas" class="bg-gray-200 text-gray-800 py-2 px-4 rounded hover:bg-gray-300">Cancelar</a>
                    <button type="submit" th:disabled="${#lists.isEmpty(propietarios)}"
                            class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 disabled:opacity-50">
                        Actualizar Mascota
                    </button>
                </div>
            </form>
        </div>
    </body>
</html>
