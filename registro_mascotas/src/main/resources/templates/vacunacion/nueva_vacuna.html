<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vacuna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-xl font-bold text-slate-900">Registrar Aplicación de Vacuna</h1>
            <a th:href="@{/vacunacion/pendientes}" class="text-sm text-slate-500 hover:text-slate-700">← Vacunación</a>
        </div>

        <div th:if="${error}" class="bg-rose-50 border border-rose-300 text-rose-800 px-4 py-3 rounded-lg text-sm"
             th:text="${error}"></div>

        <form th:action="@{/vacunacion/registrar}" th:object="${registro}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mascota *</label>
                <select name="mascota.id" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    <option value="">-- Selecciona una mascota --</option>
                    <option th:each="m : ${mascotas}" th:value="${m.id}"
                            th:text="${m.nombre + (#strings.isEmpty(m.especie) ? '' : ' (' + m.especie + ')')}"
                            th:selected="${registro.mascota != null and registro.mascota.id == m.id}"></option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Vacuna *</label>
                    <input type="text" th:field="*{vacuna}" required placeholder="Ej. Antirrábica, Séxtuple, Triple Felina..."
                           class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Número de Dosis *</label>
                    <input type="number" min="1" th:field="*{numeroDosis}" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Aplicación *</label>
                    <input type="date" th:field="*{fechaAplicacion}" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Próximo Refuerzo (opcional)</label>
                    <input type="date" th:field="*{fechaRefuerzo}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a th:href="@{/vacunacion/pendientes}" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-700 hover:bg-slate-50">Cancelar</a>
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-5 py-2 rounded-lg text-sm">
                    Guardar Vacuna
                </button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
