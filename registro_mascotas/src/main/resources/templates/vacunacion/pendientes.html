<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Refuerzos de Vacunación Pendientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <div class="flex flex-wrap justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Refuerzos de Vacunación Pendientes</h1>
            <p class="text-sm text-slate-500" th:text="'Consulta generada al: ' + ${hoy}"></p>
        </div>
        <a th:href="@{/vacunacion/nueva}"
           class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
            + Registrar Vacuna
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <p th:if="${#lists.isEmpty(vacunas)}" class="p-6 text-sm text-slate-500">No hay refuerzos pendientes a la fecha.</p>
        <table th:if="${!#lists.isEmpty(vacunas)}" class="w-full text-sm text-left">
            <thead class="bg-slate-100 text-xs uppercase text-slate-600 border-b">
            <tr>
                <th class="px-4 py-3">Mascota</th>
                <th class="px-4 py-3">Propietario</th>
                <th class="px-4 py-3">Vacuna</th>
                <th class="px-4 py-3">Dosis Aplicada</th>
                <th class="px-4 py-3">Fecha de Refuerzo</th>
                <th class="px-4 py-3 text-right">Cartilla</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr th:each="v : ${vacunas}" class="hover:bg-slate-50">
                <td class="px-4 py-3 font-medium text-slate-900" th:text="${v.mascota.nombre}"></td>
                <td class="px-4 py-3 text-slate-600"
                    th:text="${v.mascota.propietario != null ? v.mascota.propietario.nombre + (v.mascota.propietario.apellido == null ? '' : ' ' + v.mascota.propietario.apellido) : '-'}"></td>
                <td class="px-4 py-3" th:text="${v.vacuna}"></td>
                <td class="px-4 py-3" th:text="${v.numeroDosis}"></td>
                <td class="px-4 py-3 text-amber-700 font-semibold" th:text="${v.fechaRefuerzo}"></td>
                <td class="px-4 py-3 text-right">
                    <a th:href="@{/vacunacion/mascota/{id}(id=${v.mascota.id})}" class="text-indigo-700 hover:underline font-medium">
                        Ver historial
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
